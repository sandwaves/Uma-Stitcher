name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages and verify deployments via OIDC
permissions:
  contents: read
  pages: write
  id-token: write

# Don't cancel in-progress deploys; queue the next one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site (everything except the upstream snapshot)
        run: |
          mkdir -p _site
          rsync -a --exclude='_site' \
                   --exclude='source' \
                   --exclude='.git' \
                   --exclude='.github' \
                   --exclude='.vscode' \
                   --exclude='.gitignore' \
                   --exclude='*.md' \
                   ./ _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
